name: loopin
description: "Loopin a music player app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^0.13.6
  glassmorphism_ui: ^0.3.0
  just_audio: ^0.9.36
  just_audio_windows_plus: ^0.5.3
  just_audio_background: ^0.0.1-beta.10
  audio_service: ^0.18.10
  dart_des: ^1.0.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.3
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/loopin.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Tangerine
      fonts:
        - asset: assets/fonts/Tangerine-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tangerine-Bold.ttf
          weight: 700
